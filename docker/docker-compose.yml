version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ffz-postgres
    environment:
      POSTGRES_USER: ffz_user
      POSTGRES_PASSWORD: ffz_password
      POSTGRES_DB: ffz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ffz_user -d ffz_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ffz-api
    env_file:
      - ../.env
    volumes:
      - ../app:/app/app
      - ../migrations:/app/migrations
      - ../alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ffz_user:ffz_password@postgres:5432/ffz_db
      - TZ=Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
